openapi: 3.0.0
info:
  title: NewsNexus API
  description: API for the news aggregation app
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Local dev server
security:
  - ApiKeyAuth: []
paths:
  /digest:
    get:
      summary: Get the news digest
      description: Returns all the articles with their summaries and sentiment
      tags:
        - Digest
      responses:
        '200':
          description: Got the news
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
                  clusters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cluster'
                  lastUpdated:
                    type: string
                    format: date-time
        '401':
          description: No API key provided
        '403':
          description: Wrong API key
  /topic/{name}:
    get:
      summary: Get news for a topic
      description: Returns articles for a specific topic
      tags:
        - Topics
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Which topic you want
      responses:
        '200':
          description: Got the topic news
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    type: string
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
                  count:
                    type: integer
                  lastUpdated:
                    type: string
                    format: date-time
        '401':
          description: No API key
        '403':
          description: Bad API key
  /health:
    get:
      summary: Health check
      description: See if the API is running
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Its running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Article:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        url:
          type: string
        source:
          type: string
        publishedAt:
          type: string
        image:
          type: string
        summary:
          type: string
        sentiment:
          type: string
          enum: [positive, neutral, negative]
    Cluster:
      type: object
      properties:
        id:
          type: integer
        topic:
          type: string
        articles:
          type: array
          items:
            $ref: '#/components/schemas/Article'
