openapi: 3.0.0
info:
  title: NewsNexus API
  description: Multi-source news aggregation and digest API
  version: 1.0.0
  contact:
    name: NewsNexus Team
servers:
  - url: http://localhost:5000/api
    description: Development server
security:
  - ApiKeyAuth: []
paths:
  /digest:
    get:
      summary: Get complete news digest
      description: Returns all clustered news articles with summaries and sentiment
      tags:
        - Digest
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
                  clusters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cluster'
                  lastUpdated:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized - API key missing
        '403':
          description: Forbidden - Invalid API key
  /topic/{name}:
    get:
      summary: Get news by topic
      description: Returns articles filtered by specific topic
      tags:
        - Topics
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Topic name to filter by
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    type: string
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
                  count:
                    type: integer
                  lastUpdated:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /health:
    get:
      summary: Health check endpoint
      description: Check API status
      tags:
        - Health
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Article:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        url:
          type: string
        source:
          type: string
        publishedAt:
          type: string
        image:
          type: string
        summary:
          type: string
        sentiment:
          type: string
          enum: [positive, neutral, negative]
    Cluster:
      type: object
      properties:
        id:
          type: integer
        topic:
          type: string
        articles:
          type: array
          items:
            $ref: '#/components/schemas/Article'
