<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5dd5d5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3db8b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circular orbit -->
  <circle cx="200" cy="200" r="90" fill="none" stroke="#0066cc" stroke-width="10"/>
  
  <!-- Connection nodes (circles at cardinal points) -->
  <circle cx="200" cy="110" r="14" fill="#0066cc"/>
  <circle cx="290" cy="200" r="14" fill="#0066cc"/>
  <circle cx="200" cy="290" r="14" fill="#0066cc"/>
  <circle cx="110" cy="200" r="14" fill="#0066cc"/>
  
  <!-- Diagonal arrow going through -->
  <line x1="140" y1="260" x2="260" y2="140" stroke="#0066cc" stroke-width="12" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="260,140 245,150 252,132" fill="#0066cc"/>
  
  <!-- Center diamond/nexus shape (larger) -->
  <path d="M 200 160 L 240 200 L 200 240 L 160 200 Z" fill="url(#tealGradient)" stroke="#0066cc" stroke-width="4"/>
  
  <!-- Inner diamond detail -->
  <path d="M 200 175 L 225 200 L 200 225 L 175 200 Z" fill="#5dd5d5" opacity="0.9"/>
  
  <!-- Small triangle accent inside -->
  <path d="M 200 190 L 210 202 L 190 202 Z" fill="white" opacity="0.95"/>
  
  <!-- Bottom shield/heart shape (larger) -->
  <path d="M 200 250 L 170 275 L 170 310 L 200 335 L 230 310 L 230 275 Z" fill="#0066cc"/>
  <path d="M 200 258 L 178 278 L 178 305 L 200 325 L 222 305 L 222 278 Z" fill="url(#tealGradient)"/>
  
  <!-- Small accent in shield -->
  <path d="M 200 280 L 190 290 L 200 310 L 210 290 Z" fill="#5dd5d5" opacity="0.8"/>
</svg>
