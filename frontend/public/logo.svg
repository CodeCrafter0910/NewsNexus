<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gradient1)" stroke-width="4"/>
  
  <!-- Connection nodes -->
  <circle cx="100" cy="40" r="8" fill="#667eea"/>
  <circle cx="40" cy="160" r="8" fill="#667eea"/>
  <circle cx="160" cy="160" r="8" fill="#667eea"/>
  
  <!-- Center diamond/nexus -->
  <path d="M 100 70 L 130 100 L 100 130 L 70 100 Z" fill="#4db8b8" opacity="0.8"/>
  <path d="M 100 80 L 120 100 L 100 120 L 80 100 Z" fill="#5dd5d5" opacity="0.9"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="40" x2="100" y2="70" stroke="#667eea" stroke-width="3"/>
  <line x1="40" y1="160" x2="70" y2="110" stroke="#667eea" stroke-width="3"/>
  <line x1="160" y1="160" x2="130" y2="110" stroke="#667eea" stroke-width="3"/>
  
  <!-- Arrow indicating flow -->
  <path d="M 85 55 L 100 40 L 115 55" fill="none" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Inner accent -->
  <circle cx="100" cy="100" r="12" fill="#764ba2" opacity="0.6"/>
</svg>
